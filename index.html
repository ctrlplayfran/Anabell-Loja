<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anabell - Moda Infantil e Feminina</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Baloo+2:wght@800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #ffffff; overflow-x: hidden; color: #4a3728; }

    /* --- MENU DE NAVEGAÇÃO (HEADER) COM VERDE CLARO DA LOGO --- */
    .header-main {
      background: #c5e3cd; /* O verde claro exato da logo */
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-img {
      height: 48px; 
      width: auto;
      display: block;
    }

    .nav-menu {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    .nav-link {
      text-decoration: none;
      color: #1e6b1e; /* Verde escuro da logo para contraste */
      font-weight: 800;
      font-size: 0.9rem;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-link:hover {
      color: #ffffff; /* Fica branco ao passar o mouse para destacar no verde */
    }

    .nav-icons {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .nav-icons a {
      color: #1e6b1e;
      transition: transform 0.2s, color 0.2s;
      display: flex;
      align-items: center;
    }

    .nav-icons a:hover {
      transform: scale(1.1);
      color: #ffffff;
    }

    /* --- HERO SECTION ORIGINAL --- */
    .gradiente-com-nuvens {
      background: linear-gradient(180deg, #1e6b1e 0%, #a8d5a2 100%);
      position: relative;
      min-height: 520px;
      display: flex;
      flex-direction: column;
    }

    .icon-bg {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      opacity: 0.25;
    }
    
    .icon-rn { width: 75px; top: 10%; left: 8%; transform: rotate(-10deg); }
    .icon-pijama { width: 85px; top: 15%; right: 10%; transform: rotate(15deg); }
    .icon-provador { width: 70px; top: 45%; left: 5%; transform: rotate(-5deg); }
    .icon-feminino { width: 80px; top: 8%; left: 45%; transform: rotate(10deg); }
    .icon-batizado { width: 90px; top: 38%; right: 5%; transform: rotate(-12deg); }
    .icon-gestante { width: 75px; top: 52%; left: 30%; transform: rotate(5deg); }
    .icon-infantil { width: 80px; top: 48%; right: 25%; transform: rotate(-8deg); }

    .hero-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 20px 40px;
      position: relative;
      z-index: 5;
    }

    .pct { font-family: 'Baloo 2', cursive; font-size: 110px; font-weight: 800; line-height: 1; text-shadow: 0 4px 20px rgba(0,0,0,.15); color: #fff; }
    .flat { font-size: 36px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-top: -8px; color: #fff; }
    .btn { display: inline-block; margin-top: 18px; padding: 11px 34px; background: #e8334a; color: #fff; font-family: 'Nunito', sans-serif; font-size: .9rem; font-weight: 800; border-radius: 40px; text-decoration: none; box-shadow: 0 6px 18px rgba(232,51,74,.4); transition: transform .2s; }
    .btn:hover { transform: scale(1.05); }

    .cloud-side { position: absolute; z-index: 3; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.05)); opacity: 0.9; }
    .cloud-l { left: -30px; top: 20%; }
    .cloud-r { right: -30px; top: 30%; }
    .cloud-shape { position: relative; width: 150px; height: 50px; background: #fff; border-radius: 50px; }
    .cloud-shape::after, .cloud-shape::before { content: ''; position: absolute; background: #fff; border-radius: 50%; }
    .cloud-shape::after { width: 70px; height: 70px; top: -35px; left: 25px; }
    .cloud-shape::before { width: 50px; height: 50px; top: -20px; left: 75px; }

    .clouds-bottom {
      position: relative;
      width: 100%;
      line-height: 0;
      margin-top: auto;
    }

    .cloud-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* BARRA DE CONFIANÇA */
    .trust-bar { 
      background: #fdfdfd; 
      padding: 40px 20px;   
      border-top: 1px solid #eeeeee; 
      border-bottom: 1px solid #eeeeee;
    }

    .trust-container { 
      max-width: 1300px; 
      margin: 0 auto; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 30px; 
    }

    .trust-item { 
      display: flex; 
      align-items: center; 
      gap: 15px;      
      font-size: 18px; 
      font-weight: 800; 
      color: #333; 
      flex: 1;         
      min-width: 250px; 
      justify-content: center;
    }

    .trust-item svg { width: 32px; height: 32px; stroke-width: 2.5px; color: #1e6b1e; }
    .trust-item.stars { color: #f5a623; letter-spacing: 2px; }

    /* CONTEÚDO BRANCO / GRID */
    .white-content { background: white; padding: 50px 20px 60px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .section-title { text-align: center; font-size: 36px; margin-bottom: 40px; font-weight: 800; color: #1e6b1e; }
    .collection-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; }
    .card { position: relative; border-radius: 30px; overflow: hidden; height: 350px; background: #f9f6f2; box-shadow: 0 10px 25px rgba(0,0,0,0.1); transition: transform 0.3s ease; }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .arrow-btn { position: absolute; bottom: 15px; right: 15px; width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #e8334a; font-weight: bold; font-size: 20px; }

    /* RESPONSIVIDADE */
    @media (max-width: 992px) {
      .nav-menu { display: none; } 
    }

    @media (max-width: 768px) {
      .pct { font-size: 70px; }
      .flat { font-size: 24px; }
      .trust-item { min-width: 100%; font-size: 16px; }
    }
    .trust-item svg {
  min-width: 32px; /* Garante que o ícone não encolha */
  transition: transform 0.3s ease;
}

.trust-item:hover svg {
  transform: rotate(-15deg); /* Pequena animação ao passar o mouse */
}
  </style>
</head>
